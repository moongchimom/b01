<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <title>Board Modify</title>
</head>
<body>

<div class="container-fluid">
    <!-- Navbar -->
    <div class="row">
        <div class="col">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Navbar</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarNavAltMarkup">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                        <div class="navbar-nav">
                            <a class="nav-link active" href="#">Home</a>
                        </div>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <!-- Modify Form -->
    <div class="row content mt-3">
        <div class="col">
            <div class="card">
                <div class="card-header">
                    Board Modify
                </div>
                <div class="card-body">
                    <form id="f1">
                    	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    	
                        <div class="input-group mb-3">
                            <span class="input-group-text">BNO</span>
                            <input type="text" class="form-control" name="bno" th:value="${dto.bno}" readonly>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Title</span>
                            <input type="text" class="form-control" name="title" th:value="${dto.title}">
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Content</span>
                            <textarea class="form-control" rows="5" name="content" th:text="${dto.content}"></textarea>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">Writer</span>
                            <input type="text" class="form-control" name="writer" th:value="${dto.writer}" readonly>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">RegDate</span>
                            <input type="text" class="form-control"
                                   th:value="${#temporals.format(dto.regDate, 'yyyy-MM-dd HH:mm:ss')}" readonly>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text">ModDate</span>
                            <input type="text" class="form-control"
                                   th:value="${#temporals.format(dto.modDate, 'yyyy-MM-dd HH:mm:ss')}" readonly>
                        </div>

                        <div class="my-4 float-end">
                            <button type="button" class="btn btn-primary uploadFileBtn">ADD File</button>
                            <button type="button" class="btn btn-danger btn-remove">Remove</button>
                            <button type="button" class="btn btn-primary btn-modify">Modify</button>
                            <button type="button" class="btn btn-secondary btn-list">List</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 이미지 첨부 영역 -->
    <div class="row mt-3">
        <div class="col">
            <div class="d-flex flex-wrap uploadResult" style="gap: 10px;">
                <!-- 기존 게시글 이미지 출력 -->
                <th:block th:each="fileName: ${dto.fileNames}">
                    <div class="card" style="width: 200px;">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <span class="text-truncate" style="max-width: 130px;" th:text="${fileName}"></span>
                            <button type="button" class="btn btn-danger btn-sm"
                                    th:onclick="removeFile([[${fileName}]], this)">X</button>
                        </div>
                        <div class="card-body text-center">
                            <!-- 전체 경로/상대 경로 구분 처리 -->
                            <img th:if="${#strings.startsWith(fileName, 'http')}"
                                 th:src="${fileName}"
                                 th:data-src="${fileName}"
                                 class="img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;">
                            <img th:unless="${#strings.startsWith(fileName, 'http')}"
                                 th:src="|https://oti-s3-moong.s3.ap-northeast-2.amazonaws.com/${fileName}|"
                                 th:data-src="${fileName}"
                                 class="img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;">
                        </div>
                    </div>
                </th:block>
            </div>
        </div>
    </div>

    <!-- 첨부파일 업로드 모달 -->
    <div class="modal uploadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Upload File</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-3">
                        <input type="file" name="files" class="form-control" multiple>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary uploadBtn">Upload</button>
                    <button type="button" class="btn btn-outline-dark closeUploadBtn">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="row footer mt-5">
        <div class="col text-center">
            <p class="text-muted">Footer</p>
        </div>
    </div>
</div>

<!-- JS Libraries -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<script th:inline="javascript">
// X를 눌러 삭제 예약된 파일 목록
const removeFileList = [];

// X 버튼 클릭 이벤트
function removeFile(fullFileName, obj) {
    if (!confirm("파일을 삭제 목록에 추가하시겠습니까?")) return;

    removeFileList.push(fullFileName);
    console.log("삭제 예약 목록:", removeFileList);

    // 해당 카드 UI 즉시 제거
    $(obj).closest(".card").remove();
}

// S3 파일 삭제 비동기 통신
async function removeFileToServer(fileName) {
    const response = await axios.delete('/remove', {
        params: { fileName: fileName }
    });
    return response.data;
}

// 파일 업로드 비동기 통신
async function uploadToServer(formObj) {
    const response = await axios({
        method: 'post',
        url: '/upload',
        data: formObj,
        headers: {
            'Content-Type': 'multipart/form-data',
        },
    });
    return response.data;
}

$(document).ready(function () {
    const link = /*[[${pageRequestDTO.link}]]*/ '';
    const modifyUrl = /*[[@{/board/modify}]]*/ '/board/modify';
    const removeUrl = /*[[@{/board/remove}]]*/ '/board/remove';
    const listUrl = /*[[@{/board/list}]]*/ '/board/list';

    const $formObj = $("#f1");
    const uploadModal = new bootstrap.Modal(document.querySelector(".uploadModal"));

    // 업로드 모달 열기/닫기
    $(".uploadFileBtn").on("click", function(e) {
        e.preventDefault();
        uploadModal.show();
    });

    $(".closeUploadBtn").on("click", function(e) {
        e.preventDefault();
        uploadModal.hide();
    });

    // 신규 파일 업로드
    $(".uploadBtn").on("click", function(e) {
        e.preventDefault();
        const formObj = new FormData();
        const fileInput = document.querySelector("input[name='files']");
        const files = fileInput.files;

        if (!files || files.length === 0) {
            alert("업로드할 파일을 선택하세요.");
            return;
        }

        for (let i = 0; i < files.length; i++) {
            formObj.append("files", files[i]);
        }

        uploadToServer(formObj).then(result => {
            for (const uploadResult of result) {
                showUploadFile(uploadResult);
            }
            uploadModal.hide();
            fileInput.value = "";
        }).catch(err => {
            console.error("파일 업로드 오류:", err);
            alert("파일 업로드 실패");
        });
    });

    // 업로드된 파일 화면 출력
    function showUploadFile({uuid, filename, realFilename}) {
        const fullPath = realFilename || `${uuid}_${filename}`;
        const str = `
            <div class="card" style="width: 200px;">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span class="text-truncate" style="max-width: 130px;">${filename}</span>
                    <button type="button" class="btn btn-danger btn-sm" onclick="removeFile('${fullPath}', this)">X</button>
                </div>
                <div class="card-body text-center">
                    <img src="${realFilename}" data-src="${fullPath}" class="img-thumbnail" style="width: 150px; height: 150px; object-fit: cover;">
                </div>
            </div>`;
        $(".uploadResult").append(str);
    }

    // List 버튼
    $(".btn-list").on("click", function (e) {
        e.preventDefault();
        self.location = `${listUrl}?${link}`;
    });

    // 게시글 완전 삭제(Remove) 버튼
    $(".btn-remove").on("click", function (e) {
        e.preventDefault();
        if (!confirm("정말 이 게시글을 삭제하시겠습니까?")) return;
        $formObj.attr("action", `${removeUrl}?${link}`).attr("method", "post").submit();
    });

    // 게시글 수정(Modify) 버튼
    $(".btn-modify").on("click", async function (e) {
        e.preventDefault();

        if (!confirm("게시글을 수정하시겠습니까?")) return;

        // 1. 기존 form 내부의 fileNames hidden 태그 모두 정리
        $formObj.find("input[name='fileNames']").remove();

        // 2. 현재 화면의 카드에 남아있는 모든 이미지 파일 수집하여 hidden 태그 추가
        let appendTags = "";
        $(".uploadResult img").each(function (idx, imgObj) {
            let fileSrc = $(imgObj).attr("data-src") || $(imgObj).attr("src");
            if (fileSrc) {
                if (fileSrc.includes("/")) {
                    fileSrc = fileSrc.substring(fileSrc.lastIndexOf("/") + 1);
                }
                appendTags += `<input type="hidden" name="fileNames" value="${fileSrc}">`;
            }
        });
        $formObj.append(appendTags);

        // 3. removeFileList에 등록된 파일이 있을 때만 S3 삭제 실행
        if (removeFileList.length > 0) {
            console.log("X 누른 파일 S3 삭제 시작:", removeFileList);

            const deletePromises = removeFileList.map(targetFile => {
                return removeFileToServer(targetFile);
            });

            try {
                await Promise.all(deletePromises);
                console.log("S3 파일 삭제 완료");
            } catch (err) {
                console.error("S3 파일 삭제 실패:", err);
            }
        }

        // 4. 폼 전송
        $formObj.attr("action", `${modifyUrl}?${link}`).attr("method", "post").submit();
    });
});
</script>
</body>
</html>
